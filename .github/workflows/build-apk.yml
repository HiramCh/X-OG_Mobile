name: Compilar APK (Halo 2 MTK)

# Solo manual: los APK de prueba se empaquetan con tools/build_apk_no_ndk.sh.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma 36, NDK 27.2 y CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/XOG-Mobile-Halo2-MTK.apk
          ls -lh out

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: XOG-Mobile-Halo2-MTK
          path: out/XOG-Mobile-Halo2-MTK.apk

      - name: Publicar en "Releases" (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Halo 2 MTK build ${{ github.run_number }}
          prerelease: true
          files: out/XOG-Mobile-Halo2-MTK.apk
